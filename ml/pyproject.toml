[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bowlsense"
version = "0.1.0"
description = "AI analysis of cricket bowling from video and images"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
include = ["bowlsense*", "synth*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["bowlsense", "synth", "train", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient still runs on httpx (used in tests only).
    "ignore:Using `httpx` with `starlette.testclient`",
]

[[tool.mypy.overrides]]
# Third-party packages without type information; our own code stays strict.
module = ["rtmlib", "rtmlib.*", "onnxruntime", "onnxruntime.*", "mediapipe", "mediapipe.*", "ultralytics", "ultralytics.*", "imageio_ffmpeg", "reportlab", "reportlab.*", "sklearn", "sklearn.*", "tslearn", "tslearn.*"]
ignore_missing_imports = true
follow_imports = "skip"
