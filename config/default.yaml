# BowlSense configuration. Every tunable threshold, weight and model name lives here.
# Override the file location with the BOWLSENSE_CONFIG environment variable.
# Everything runs locally: the only URLs allowed here are localhost / 127.0.0.1.

video:
  min_fps_hard: 60
  min_fps_recommended: 120
  min_height_px: 720
  min_bowler_visible_frac: 0.70
  min_mean_keypoint_conf: 0.5
  front_view_width_ratio: 0.12   # shoulder width / body height above this in the run-up = front/behind
  approach_size_change: 0.15     # bowler grows (front) / shrinks (behind) by this fraction over the run-up
detect:
  yolo_model: yolo11n.pt          # in models/; person (class 0) and sports ball (class 32)
  person_conf: 0.3
  tracker: bytetrack.yaml         # bundled with ultralytics
  min_track_frames: 10            # shorter tracks are ignored when picking the bowler
pose:
  backend: rtm          # rtm | mediapipe
  crop_padding: 0.2     # bowler bbox is padded by 20% on each side before pose estimation
  rtm_model: rtmpose-m_halpe26_256x192.onnx       # in models/
  rtm_input_size: [192, 256]                     # width, height
  mediapipe_model: pose_landmarker_full.task      # in models/
  min_conf: 0.3
  max_gap_frames: 5
  savgol_window_s: 0.1  # Savitzky-Golay window ~ fps/10 frames, rounded up to odd
  savgol_polyorder: 2
  lift_3d: false        # optional MotionBERT 3D lift (scripts/export_motionbert.py makes the model)
  lift_model: motionbert_lite.onnx   # in models/
  lift_window: 243      # frames per MotionBERT window
body:
  height_factor: 1.15     # height = vertical ankle-to-nose x this (spec said 1.07; see PROGRESS.md)
  height_top_frac: 0.2    # use the median of the top 20% of run-up frames
  runup_end_before_peak_s: 0.6  # run-up window ends this long before peak bowling-wrist speed
  ankle_height_pct: 3.9   # ankle joint above the ground, % of height (anthropometry)
  hand_length_pct: 10.8   # wrist to fingertips, % of height; ball height ~ wrist + hand
phases:
  use_model: false                  # use the trained release model (models/phase_model.pt) if present
  model_file: phase_model.pt
  release_refine_frames: 3          # refine release to the wrist-height peak within +-N frames
  ffc_window_s: 0.4                 # search for front-foot contact this long before release
  bfc_window_s: 0.35                # search for back-foot contact this long before ffc
  contact_speed_h_per_s: 0.5        # ankle vertical speed below this (heights/s) = "still"
  contact_min_frames: 3             # ...for at least this many frames
  contact_ground_tol_pct: 3.0       # ...within this % of height of the ankle's lowest point
  run_up_speed_frac: 0.2            # run-up starts when hip speed > 20% of peak
  follow_through_speed_frac: 0.15   # follow-through ends when hip speed < 15% of peak
  speed_hold_s: 0.1                 # ...and the crossing must hold this long (rejects noise)
  hip_speed_smooth_s: 0.25          # extra smoothing for the (slow) hip-speed signal only
  contact_velocity_window_s: 0.1    # Savitzky-Golay derivative window for ankle velocity
  contact_fit_s: 0.05               # change-point fit uses this much data either side of the impact
  contact_fit_order: 2              # 2 = quadratic: a foot speeds up as it comes down
  low_confidence: 0.2               # confidence when events are out of order or a fallback was used
  no_horizontal_motion_confidence: 0.5  # front/behind views: run-up events can't be seen
legality:
  elbow_extension_threshold_deg: 15.0
  high_conf_fps: 200          # confidence "high" needs this fps...
  high_conf_keypoint: 0.7     # ...and mean elbow/wrist keypoint confidence above this
  medium_conf_fps: 120        # "medium" needs this fps; below it is "low"
  fit_degree: 3               # elbow angle is fitted with this polynomial around AH..release
  fit_pad_s: 0.02             # ...extending the fit this far either side of the window
  # Screening is only done (and a delivery only flagged) when the measurement can be trusted:
  screen_min_fps: 60          # below this the elbow straightens within a frame or two
  screen_views: [side, unknown]  # elbow angles are foreshortened from front-on/behind
  screen_min_phase_confidence: 0.5  # phase events out of order (0.2) -> wrong window
  screen_max_window_s: 0.3    # arm-horizontal -> release takes ~0.05-0.15 s in real bowling
  screen_max_plausible_deg: 45  # more elbow straightening than this is a tracking error
alignment:
  mixed_threshold_deg: 30
  counter_rotation_flag_deg: 30
  closed_max_deg: 25          # body line within 25 deg of side-on = "closed"
  open_min_deg: 55            # body line at least 55 deg towards front-on = "open"
  width_calib_top_frac: 0.2   # full shoulder/hip width = median of the widest 20% of run-up frames
  min_fit_half_s: 0.03        # counter-rotation minimum = quadratic fit over +-this around the dip
faults:
  knee_collapse_deg: 20
  overstride_pct: 90
  understride_pct: 65
  head_fall_pct: 15
  lateral_flexion_deg: 30
  low_release_pct: 115
  runup_decel_pct: 15
  short_follow_pct: 40
  weak_front_arm_pct: 0       # front wrist this far (% of height) below its shoulder at FFC
  chain_order_tolerance_s: 0.025  # out-of-order peaks closer than this are measurement noise
  runup_final_window_s: 1.5   # "final 3 strides" before BFC
  runup_speed_smooth_s: 0.1   # hip-speed derivative window for the run-up deceleration check
  knee_fit_degree: 2          # knee angle fitted on the raw track strictly inside FFC..release
  chain_window_after_release_s: 0.1
  # Where severity reaches 100. Faults not listed ramp from threshold to 2x threshold;
  # "too low" faults (and zero thresholds) need an explicit point.
  severity_full: {UNDERSTRIDE: 50, LOW_RELEASE: 100, SHORT_FOLLOW: 20, WEAK_FRONT_ARM: 10}
  weights: {KNEE_COLLAPSE: 1.5, OVERSTRIDE: 1, UNDERSTRIDE: 1, HEAD_FALL: 1, LATERAL_FLEXION: 1.5,
            WEAK_FRONT_ARM: 0.7, RUNUP_DECEL: 0.7, LOW_RELEASE: 0.7, CHAIN_ORDER: 1, SHORT_FOLLOW: 0.5}
injury:
  weights: {lumbar: 0.40, knee: 0.20, shoulder: 0.15, side_strain: 0.15, fatigue_modifier: 0.10}
  bands: {low: 35, high: 65}
  # Each driver scores 0 at or below `low`, 100 at or above `high`, linear in between.
  # arm_slot / arm speed / trunk rotation speed bounds are BowlSense defaults (the spec gives
  # none, and there is no population data for a true percentile); tune them in evaluation.
  drivers:
    counter_rotation_deg: [10, 40]
    lateral_flexion_deg: [15, 40]
    knee_collapse_deg: [0, 40]
    stride_pct: [85, 110]
    arm_slot_deg: [20, 60]                 # bowling arm angle from vertical at release
    arm_angular_velocity_deg_s: [1500, 3000]
    trunk_rotation_speed_deg_s: [400, 1000]
    fatigue_index: [0, 100]
fatigue:
  baseline_deliveries: 6
  alert_index: 40
  recent_deliveries: 3        # session index = mean of the last 3 deliveries' indices
  fault_increase_alert: 2     # alert if faults rise by this many vs baseline
  # A drop of this many % from baseline scores 100 for that metric.
  full_drop_pct: {runup_speed: 15, release_height: 5, wrist_speed: 10, technique_score: 20}
  weights: {runup_speed: 0.3, release_height: 0.2, wrist_speed: 0.3, technique_score: 0.2}
workload:
  acwr_flag: 1.5
  acute_days: 7
  chronic_days: 28
  min_history_days: 21        # ACWR needs at least this much history; otherwise not reported
delivery:
  length_zones_m: {yorker: 2, full: 6, good: 8, short: 10}
  type_model_file: delivery_type_seq.pt # pace/spin sequence classifier; skipped when the file is absent
  speed_frames: [5, 10]        # speed fitted over the first 5..10 tracked frames after release
  first_ball_within_frames: 3  # the ball must be found within this many frames of release
  line_bands_m: {middle: 0.05, stump: 0.15, wide: 0.9}   # lateral distance from middle stump
  batter_hand: right           # off side = bowler's left for a right-handed batter
  position_error_px: 2.0       # assumed bounce-point error in the image...
  max_length_error_m: 0.5      # ...report length only if it moves the bounce less than this
  max_line_error_m: 0.15       # ...and line only if less than this (stumps are 0.23 m wide)
compare:
  resample_points: 50          # each action is time-normalised (BFC -> follow-through end) to this many points
  similarity_scale: 2.0        # similarity % = 100 * exp(-dtw_distance / scale)
  reference_dir: data/reference
  consistency_metrics: [technique_score, elbow_extension_deg, stride_pct, release_height_pct, knee_collapse_deg]
bowler_id:
  min_bowlers: 3
  min_deliveries_per_bowler: 20
  epochs: 150
  hidden: 32
ball:
  yolo_class: 32               # COCO "sports ball"
  det_conf: 0.1
  roi_px: 480                  # square search window around the predicted ball (and the hand at release)
  max_missed: 4                # Kalman bridges at most this many frames without a detection
  gate_px: 80                  # a detection further than this from the prediction is ignored
  meas_noise_px: 2.0
  accel_noise_px_s2: 4000.0    # process noise on the vertical acceleration (gravity in pixels)
  track_after_release_s: 1.0
jobs:
  poll_interval_s: 2
  max_attempts: 3       # first try + 2 retries
api:
  max_upload_mb: 500
  allowed_extensions: [".mp4", ".mov", ".avi", ".jpg", ".jpeg", ".png"]
render:
  ffmpeg_preset: veryfast
  crf: 23                    # H.264 quality (lower = better, bigger)
  conf_low: 0.3              # joint dots: red below this...
  conf_high: 0.7             # ...amber in between, green at or above this
  tint_alpha: 0.25           # red tint strength on frames in a flagged legality window
  keyframe_events: [bfc, ffc, arm_horizontal, release, follow_through_end]
clipping:
  before_release_s: 2.5      # each delivery clip starts this long before release...
  after_release_s: 1.5       # ...and ends this long after
  min_gap_s: 3.0             # releases closer than this are treated as one delivery
  min_peak_frac: 0.5         # a release must reach this fraction of the fastest wrist speed
coach:
  provider: ollama
  ollama_url: http://localhost:11434
  model: llama3.1:8b       # use qwen2.5:3b on low-RAM laptops
  max_words: 250
  timeout_s: 120
  retries: 1
  top_issues: 3              # the report prioritises this many issues
  chat_history_turns: 6      # chat keeps this many previous exchanges as context
image:                    # image mode (one photo, spec 7J)
  front_knee_min_deg: 160   # front knee at least this straight from FFC to release
  arm_slot_high_deg: 20     # arm within this of vertical at release = high slot
  arm_slot_round_deg: 45    # this far or more from vertical = round-arm
  front_hip_width_ratio: 0.12  # hip width / body size above this = front view (auto view)
storage:
  root: data/storage       # relative paths resolve against the repo root
  db_path: data/bowlsense.db
  models_dir: models
server:
  host: 127.0.0.1
  api_port: 8000
  web_port: 3000
